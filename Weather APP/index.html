<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <h1 class="head">Weather App</h1>
    <div class="card">
        <div class="search_area">
            <input type="text" placeholder="Enter City...">
            <button class="search_city"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="temp-box">
            <div class="icon">

            </div>
            <br>
            <h3 class="city_box">City</h3>
            <h2 class="temp_box">0 ° C</h2>
        </div>
        
        <div class="result">
            <div class="block-1">
                <i class="fa-solid fa-water"></i>
                <p >Humidity</p>
                <p class="humidity_box">25%</p>
            </div>
            <div class="block-2">
                <i class="fa-solid fa-wind"></i>
                <p>Wind speed</p>
                <p class="wind_box">18.12 m/s</p>
            </div>
        </div>
    </div>
    <footer>
        Made by Lavish ❤️.
    </footer>
    

    <script src="script.js"></script>
</body>
</html>
