<!DOCTYPE html>
<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    overflow:hidden;
    font-family:'Orbitron', sans-serif;
    position:relative;
}

/* Slow subtle moving grayscale background */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:linear-gradient(
        120deg,
        #000000,
        #111111,
        #1a1a1a,
        #0a0a0a,
        #000000
    );
    background-size:400% 400%;
    animation: subtleMove 25s ease-in-out infinite;
    z-index:-2;
}

/* Soft spotlight effect */
body::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    filter:blur(100px);
    animation: spotlightMove 30s ease-in-out infinite alternate;
    z-index:-1;
}

/* Heading */
h1{
    padding-left:120px;
    font-size:110px;
    font-weight:900;
    letter-spacing:10px;
    text-transform:uppercase;
    color:#ffffff;
    position:relative;

    animation: floatText 8s ease-in-out infinite;
}

/* Light shimmer overlay */
h1::after{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:50%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.2),
        transparent
    );
    animation: shimmer 8s linear infinite;
}

/* Animations */

@keyframes subtleMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes spotlightMove{
    0%{transform:translate(-200px,-150px);}
    100%{transform:translate(250px,200px);}
}

@keyframes floatText{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

@keyframes shimmer{
    0%{left:-150%;}
    100%{left:150%;}
}

</style>
</head>
<body>

<h1>MASTER LAVISH</h1>
<script src="practice.js"></script>

</body>
</html>
